<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الصور الخاص</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Cairo',sans-serif}
    .hidden{display:none!important}
    button:disabled{opacity:.55;cursor:not-allowed}
  </style>
</head>
<body class="bg-zinc-950 min-h-screen text-zinc-100 p-4">
<header class="text-center py-5">
  <h1 class="text-2xl font-black text-amber-400">📸 معرض الصور الخاص</h1>
</header>

<main class="max-w-xl mx-auto">
  <!-- الصورة الرئيسية -->
  <section id="home" class="text-center space-y-4">
    <p class="text-sm text-zinc-400">اضغط على الصورة باش تدخل للمعرض</p>
    <button type="button" id="coverButton"
      class="block cursor-pointer border-4 border-amber-400/30 rounded-3xl overflow-hidden shadow-2xl hover:border-amber-400 transition p-2 max-w-xs mx-auto bg-zinc-900">
      <img src="photos/photo-1.jpg" alt="الصورة الرئيسية" class="w-full h-auto object-cover rounded-2xl">
    </button>
    <p class="text-xs text-zinc-500">المعرض محمي بكلمة مرور</p>
    <div id="loginBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-right space-y-3">
      <label for="galleryPassword" class="block text-sm">كلمة المرور للدخول</label>
      <input id="galleryPassword" type="password" autocomplete="current-password"
        class="w-full rounded-xl bg-zinc-800 border border-zinc-700 p-3 text-white"
        placeholder="أدخل كلمة المرور">
      <button id="loginButton" type="button" class="w-full bg-amber-400 text-zinc-950 rounded-xl p-3 font-bold">دخول</button>
      <p id="loginMessage" class="text-sm min-h-6" aria-live="polite"></p>
    </div>
  </section>

  <!-- المعرض -->
  <section id="gallery" class="hidden space-y-5">
    <div class="flex flex-wrap justify-between items-center gap-3 bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
      <h2 class="text-sm font-bold text-amber-400">🔒 ألبوم الصور المحمي</h2>
      <div class="flex gap-2">
        <button id="showUploadButton" type="button" class="bg-amber-400 text-zinc-950 px-3 py-2 rounded-xl text-xs font-bold">➕ إضافة صور</button>
        <button id="lockButton" type="button" class="bg-zinc-800 text-zinc-300 px-3 py-2 rounded-xl text-xs font-bold">قفل المعرض</button>
      </div>
    </div>

    <section id="uploadBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
      <h3 class="font-bold text-amber-400">إضافة صور جديدة</h3>
      <label for="uploadPassword" class="block text-sm">كلمة مرور الإضافة</label>
      <input id="uploadPassword" type="password" autocomplete="off"
        class="w-full rounded-xl bg-zinc-800 border border-zinc-700 p-3 text-white"
        placeholder="أدخل كلمة مرور الإضافة">
      <button id="checkUploadPassword" type="button" class="w-full bg-zinc-700 rounded-xl p-3 font-bold">تأكيد كلمة المرور</button>
      <p id="uploadMessage" class="text-sm min-h-6" aria-live="polite"></p>
      <div id="fileArea" class="hidden space-y-3">
        <label for="imageUploader" class="block text-sm">اختار صورة أو مجموعة صور</label>
        <input id="imageUploader" type="file" accept="image/*" multiple
          class="block w-full text-sm text-zinc-300 file:ml-3 file:rounded-lg file:border-0 file:bg-amber-400 file:px-4 file:py-2 file:font-bold file:text-zinc-950">
        <button id="saveImages" type="button" class="w-full bg-amber-400 text-zinc-950 rounded-xl p-3 font-bold">حفظ الصور</button>
      </div>
    </section>

    <div id="galleryGrid" class="grid grid-cols-2 gap-3">
      <figure class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
        <img src="photos/photo-2.jpg" alt="الصورة الثانية" class="w-full h-48 object-cover">
      </figure>
    </div>
    <p class="text-xs text-zinc-500 leading-6">الصور التي تضيفها تُحفظ في هذا المتصفح وعلى هذا الجهاز فقط. لا تظهر تلقائياً للزوار الآخرين أو على أجهزة أخرى.</p>
  </section>
</main>

<script>
(() => {
  "use strict";

  // تنبيه: كلمات المرور في HTML/JavaScript ليست حماية قوية ويمكن كشفها بفحص الكود.
  const GALLERY_PASS = "malik lhind";
  const UPLOAD_PASS = "adamsbai123";

  const $ = id => document.getElementById(id);
  const home = $("home");
  const gallery = $("gallery");
  const loginBox = $("loginBox");
  const loginMessage = $("loginMessage");
  const uploadBox = $("uploadBox");
  const uploadMessage = $("uploadMessage");
  const fileArea = $("fileArea");
  const grid = $("galleryGrid");

  let db = null;
  let dbReady = false;
  let pendingFiles = [];

  function openDatabase() {
    if (!("indexedDB" in window)) {
      uploadMessage.textContent = "المتصفح لا يدعم حفظ الصور محلياً.";
      return;
    }
    const request = indexedDB.open("MalikPrivateGallery", 1);
    request.onupgradeneeded = event => {
      const database = event.target.result;
      if (!database.objectStoreNames.contains("images")) {
        database.createObjectStore("images", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = event => {
      db = event.target.result;
      dbReady = true;
      loadSavedImages();
    };
    request.onerror = () => {
      uploadMessage.textContent = "تعذر فتح مخزن الصور في هذا المتصفح.";
    };
  }

  function showLogin() {
    loginBox.classList.remove("hidden");
    $("galleryPassword").focus();
    loginMessage.textContent = "";
  }

  function login() {
    const entered = $("galleryPassword").value;
    if (entered === GALLERY_PASS) {
      loginMessage.textContent = "";
      home.classList.add("hidden");
      gallery.classList.remove("hidden");
      $("galleryPassword").value = "";
      if (!dbReady) openDatabase();
    } else {
      loginMessage.textContent = "كلمة المرور غير صحيحة. حاول مرة أخرى.";
      loginMessage.className = "text-sm min-h-6 text-red-400";
    }
  }

  function lockGallery() {
    gallery.classList.add("hidden");
    home.classList.remove("hidden");
    loginBox.classList.add("hidden");
    uploadBox.classList.add("hidden");
    fileArea.classList.add("hidden");
    $("galleryPassword").value = "";
    $("uploadPassword").value = "";
    $("imageUploader").value = "";
    uploadMessage.textContent = "";
  }

  function addImageCard(blob, name) {
    const url = URL.createObjectURL(blob);
    const figure = document.createElement("figure");
    figure.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden";
    figure.dataset.savedImage = "true";

    const img = document.createElement("img");
    img.src = url;
    img.alt = name || "صورة مضافة";
    img.className = "w-full h-48 object-cover";
    figure.appendChild(img);
    grid.prepend(figure);
  }

  function loadSavedImages() {
    if (!db) return;
    const tx = db.transaction("images", "readonly");
    const request = tx.objectStore("images").getAll();
    request.onsuccess = () => {
      grid.querySelectorAll("[data-saved-image]").forEach(node => node.remove());
      request.result.forEach(item => addImageCard(item.blob, item.name));
    };
  }

  $("coverButton").addEventListener("click", showLogin);
  $("loginButton").addEventListener("click", login);
  $("galleryPassword").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
  });
  $("lockButton").addEventListener("click", lockGallery);

  $("showUploadButton").addEventListener("click", () => {
    uploadBox.classList.toggle("hidden");
    fileArea.classList.add("hidden");
    $("uploadPassword").value = "";
    uploadMessage.textContent = "";
  });

  $("checkUploadPassword").addEventListener("click", () => {
    if ($("uploadPassword").value === UPLOAD_PASS) {
      uploadMessage.textContent = "كلمة المرور صحيحة. اختار الصور الآن.";
      uploadMessage.className = "text-sm min-h-6 text-emerald-400";
      fileArea.classList.remove("hidden");
    } else {
      fileArea.classList.add("hidden");
      uploadMessage.textContent = "كلمة مرور الإضافة غير صحيحة.";
      uploadMessage.className = "text-sm min-h-6 text-red-400";
    }
  });

  $("imageUploader").addEventListener("change", event => {
    pendingFiles = Array.from(event.target.files || []).filter(file => file.type.startsWith("image/"));
    uploadMessage.textContent = pendingFiles.length
      ? "تم اختيار " + pendingFiles.length + " صورة."
      : "لم يتم اختيار صور صالحة.";
    uploadMessage.className = "text-sm min-h-6 text-zinc-300";
  });

  $("saveImages").addEventListener("click", () => {
    if (!dbReady || !db) {
      uploadMessage.textContent = "مخزن الصور مازال كيتجهز. انتظر لحظة وحاول مجدداً.";
      uploadMessage.className = "text-sm min-h-6 text-red-400";
      return;
    }
    if (!pendingFiles.length) {
      uploadMessage.textContent = "اختار صورة واحدة على الأقل.";
      uploadMessage.className = "text-sm min-h-6 text-red-400";
      return;
    }

    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    pendingFiles.forEach(file => store.add({ name: file.name, blob: file }));

    tx.oncomplete = () => {
      uploadMessage.textContent = "تم حفظ الصور بنجاح.";
      uploadMessage.className = "text-sm min-h-6 text-emerald-400";
      $("imageUploader").value = "";
      pendingFiles = [];
      loadSavedImages();
    };
    tx.onerror = () => {
      uploadMessage.textContent = "وقع خطأ أثناء حفظ الصور.";
      uploadMessage.className = "text-sm min-h-6 text-red-400";
    };
  });
})();
</script>
</body>
</html>
